[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Serve the exported single-page app for navigation requests.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Preserve the incoming cross-origin isolation headers for WebAssembly support.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
